[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'

[built-in options]
c_args = []
cpp_args = []
c_link_args = ['-sSIDE_MODULE=2', '-sWASM_BIGINT=1', '-pthread']
cpp_link_args = ['-sSIDE_MODULE=2', '-sWASM_BIGINT=1', '-pthread']

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
