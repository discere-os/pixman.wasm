# Meson cross-compilation file for WebAssembly with SIMD optimization
[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'
ranlib = 'emranlib'
pkgconfig = 'emconfigure pkg-config'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[built-in options]
c_std = 'gnu99'
buildtype = 'release'

[properties]
# Core WASM SIMD flags
c_args = [
  '-msimd128',                    # Enable WASM SIMD128 (NOT -s SIMD=1, deprecated)
  '-DPIXMAN_NO_TLS',             # Disable thread-local storage
  '-DHAVE_CONFIG_H',             # Use configuration header
  '-fvisibility=hidden',         # Match original build flags
  '-fno-strict-aliasing',        # Prevent aliasing issues
  '-O3',                         # Maximum optimization
  '-DNDEBUG',                    # Disable debug assertions
  '-DPIXMAN_WASM_SIMD'           # Enable WASM-specific SIMD code paths
]

c_link_args = [
  '-msimd128',                   # SIMD support in linking
  '-sWASM=1',                    # WebAssembly output
  '-sMODULARIZE=1',             # ES6 module format
  '-sEXPORT_ES6=1',             # ES6 export syntax
  '-sINITIAL_MEMORY=32MB',      # Initial memory pool
  '-sMAXIMUM_MEMORY=256MB',     # Maximum memory limit
  '-sALLOW_MEMORY_GROWTH=1',    # Dynamic memory growth
  '-sSTACK_SIZE=2MB',           # Stack size for recursion
  '-sASSERTIONS=0',             # Disable runtime assertions
  '-O3',                         # Link-time optimization
  '-flto',                       # Link-time optimization
  '--closure', '1',              # Closure compiler optimization
  '-sUSE_PTHREADS=0',           # Disable threading for foundation build
  '-sFILESYSTEM=0',             # Disable filesystem if not needed
  '-sEXPORTED_FUNCTIONS=["_pixman_image_create_bits","_pixman_image_unref","_pixman_image_composite32","_pixman_format_supported_source","_pixman_format_supported_destination","_pixman_image_fill_rectangles","_pixman_transform_init_identity","_pixman_image_set_transform","_pixman_region32_init","_pixman_region32_fini","_pixman_wasm_simd_available","_pixman_wasm_benchmark_composite","_malloc","_free"]',
  '-sEXPORTED_RUNTIME_METHODS=["ccall","cwrap","HEAPU8","HEAP32","setValue","getValue"]'
]