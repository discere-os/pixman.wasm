[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'
ranlib = 'emranlib'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[built-in options]
c_std = 'gnu99'
buildtype = 'release'
default_library = 'static'
c_args = ['-O3', '-msimd128', '-fPIC', '-DPIXMAN_NO_TLS']
c_link_args = ['-O3', '-msimd128']